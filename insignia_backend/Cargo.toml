[package]
name = "insignia_backend"
description = "insignia - modern and secure identity platform"
version = "0.0.1"
edition = "2021"

[profile.release]
lto = true
debug = false
opt-level = 3
codegen-units = 1

[workspace.dependencies]
sha2 = "0.10.8"
actix = "0.13.1"
redis = "0.23.3"
blake3 = "1.5.0"
argon2 = "0.5.2"
nanoid = "0.4.0"
tonic = "0.10.2"
prost = "0.12.1"
chrono = "0.4.31"
tracing = "0.1.37"
futures = "0.3.28"
actix-rt = "2.9.0"
actix-web = "4.4.0"
once_cell = "1.18.0"
actix-cors = "0.6.4"
actix-utils = "3.0.1"
serde_json = "1.0.107"
jsonwebtoken = "8.3.0"
futures-util = "0.3.28"
awc = { version = "3.2.0", features = ["rustls"] }
serde = { version = "1.0.188", features = ["derive"] }
cookie = { version = "0.17.0", features = ["secure"] }
clap = { version = "4.4.6", features = ["derive", "env"] }
actix-session = { version = "0.8.0", features = ["redis-actor-session"] }
webauthn-rs = { version = "0.4.8", features = ["danger-allow-state-serialisation"] }
sea-orm = { version = "0.12.3", features = ["macros", "sqlx-postgres", "runtime-actix-rustls"] }

[build-dependencies]
tonic-build = "0.10.2"

[dependencies]
tracing-appender = "0.2.2"
tracing-subscriber = "0.3.17"
awc = { workspace = true }
clap = { workspace = true }
actix = { workspace = true }
tonic = { workspace = true }
prost = { workspace = true }
redis = { workspace = true }
serde = { workspace = true }
blake3 = { workspace = true }
chrono = { workspace = true }
argon2 = { workspace = true }
futures = { workspace = true }
sea-orm = { workspace = true }
tracing = { workspace = true }
actix-rt = { workspace = true }
once_cell = { workspace = true }
actix-web = { workspace = true }
serde_json = { workspace = true }
actix-cors = { workspace = true }
actix-utils = { workspace = true }
webauthn-rs = { workspace = true }
futures-util = { workspace = true }
jsonwebtoken = { workspace = true }
actix-session = { workspace = true }

routes = { path = "./routes" }
common = { path = "./common" }
services = { path = "./services" }

[workspace]
members = [
    "./common",
    "./routes",
    "./models",
    "./services",
    "./migration"
]
