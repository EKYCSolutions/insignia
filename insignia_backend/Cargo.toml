[package]
name = "insignia_backend"
description = "insignia - modern and secure identity platform"
version = "0.0.2"
edition = "2021"

[profile.release]
lto = true
debug = false
opt-level = 3
codegen-units = 1

[[bin]]
name = "insignia"
path = "src/main.rs"

[[bin]]
name = "insignia-integration-server"
path = "src/integration_server.rs"

[workspace.dependencies]
sha2 = "0.10.8"
actix = "0.13.1"
redis = "0.23.3"
blake3 = "1.5.0"
argon2 = "0.5.2"
nanoid = "0.4.0"
tonic = "0.11.0"
prost = "0.12.4"
pbjson = "0.6.0"
base64 = "0.21.5"
chrono = "0.4.31"
tracing = "0.1.37"
futures = "0.3.28"
protobuf = "3.3.0"
actix-rt = "2.9.0"
actix-web = "4.4.0"
once_cell = "1.18.0"
actix-cors = "0.6.4"
actix-utils = "3.0.1"
serde_json = "1.0.107"
prost-types = "0.12.4"
pbjson-types = "0.6.0"
jsonwebtoken = "8.3.0"
futures-util = "0.3.28"
openidconnect = "3.4.0"
tracing-opentelemetry = "0.24.0"
awc = { version = "3.2.0", features = ["rustls"] }
serde = { version = "1.0.188", features = ["derive"] }
cookie = { version = "0.17.0", features = ["secure"] }
clap = { version = "4.4.6", features = ["derive", "env"] }
tokio = { version = "1.0", features = ["macros", "rt-multi-thread"] }
google-api-proto = { version = "1.458.0", features = ["google-rpc"] }
actix-session = { version = "0.8.0", features = ["redis-actor-session"] }
webauthn-rs = { version = "0.4.8", features = [
  "danger-allow-state-serialisation",
] }
sea-orm = { version = "0.12.3", features = [
  "macros",
  "sqlx-postgres",
  "runtime-actix-rustls",
] }

[dependencies]
tonic-health = "0.11.0"
tonic-reflection = "0.11.0"
tracing-appender = "0.2.2"
awc = { workspace = true }
clap = { workspace = true }
actix = { workspace = true }
tokio = { workspace = true }
tonic = { workspace = true }
prost = { workspace = true }
redis = { workspace = true }
serde = { workspace = true }
base64 = { workspace = true }
blake3 = { workspace = true }
chrono = { workspace = true }
argon2 = { workspace = true }
futures = { workspace = true }
sea-orm = { workspace = true }
tracing = { workspace = true }
actix-rt = { workspace = true }
once_cell = { workspace = true }
actix-web = { workspace = true }
serde_json = { workspace = true }
actix-cors = { workspace = true }
actix-utils = { workspace = true }
webauthn-rs = { workspace = true }
futures-util = { workspace = true }
jsonwebtoken = { workspace = true }
actix-session = { workspace = true }
tracing-opentelemetry = { workspace = true }
tracing-subscriber = { version = "0.3.17", features = ["json"] }

routes = { path = "./routes" }
common = { path = "./common" }

services = { path = "./services" }
tracing-actix-web = "0.7.11"
opentelemetry = { version = "0.23.0", features = ["metrics"] }
opentelemetry-otlp = { version = "0.16.0", features = [
  "trace",
  "metrics",
  "http-proto",
  "reqwest-client"
] }
opentelemetry_sdk = { version = "0.23.0", features = [
  "metrics",
  "tokio",
  "rt-tokio",
] }

[workspace]
members = ["./common", "./routes", "./models", "./services", "./migration"]
