version: v1
managed:
  enabled: true
plugins:
  - plugin: buf.build/community/neoeinstein-prost:v0.2.3
    out: grpc/
    opt:
      - compile_well_known_types
      - extern_path=.google.protobuf=::pbjson_types
      - extern_path=.google.rpc=::google_api_proto::google::rpc
      - file_descriptor_set
