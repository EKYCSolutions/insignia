---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: insignia-frontend
  namespace: default
  labels:
    app.kubernetes.io/component: insignia
spec:
  selector:
    matchLabels:
      app: insignia-frontend
  template:
    metadata:
      labels:
        app: insignia-frontend
    spec:
      containers:
      - name: insignia-frontend
        image: ghcr.io/xshadowlegendx/insignia:latest

        command: [/opt/app/insignia, -m, frontend]

        resources:
          limits:
            cpu: '1'
            memory: 1Gi
          requests:
            cpu: 64m
            memory: 128Mi

        ports:
        - name: http
          containerPort: 6969

---
apiVersion: v1
kind: Service
metadata:
  name: insignia-frontend
  namespace: default
spec:
  selector:
    app: insignia-frontend
  ports:
  - name: http
    port: 80
    targetPort: http
