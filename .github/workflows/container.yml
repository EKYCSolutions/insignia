name: container

on:
  workflow_call:
    inputs:
      image_version_tag:
        type: string
        required: true

jobs:
  build-insignia-postgresql-image:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64]

    steps:
      - uses: actions/checkout@v4

      - name: setup docker buildx
        uses: docker/setup-buildx-action@v3

      - name: login to github container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: set lowercase image repository
        id: img
        run: echo "repo=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: build and push insignia postgresql image
        uses: docker/build-push-action@v5
        with:
          push: true
          context: ./docker
          file: ./docker/postgres.Dockerfile
          tags: ghcr.io/${{ steps.img.outputs.repo }}:postgresql-${{ inputs.image_version_tag }}

  build-insignia-image:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: setup qemu
        uses: docker/setup-qemu-action@v3

      - name: setup docker buildx
        uses: docker/setup-buildx-action@v3

      - name: login to github container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: set lowercase image repository
        id: img
        run: echo "repo=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: build and push insignia image
        uses: docker/build-push-action@v6
        with:
          push: true
          platforms: linux/amd64
          context: ./insignia_backend
          file: ./docker/insignia.Dockerfile
          tags: ghcr.io/${{ steps.img.outputs.repo }}:${{ inputs.image_version_tag }}
