name: container

on:
  workflow_call:
    inputs:
      image_version_tag:
        type: string
        required: true

jobs:
  build-insignia-postgresql-image:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64]

    steps:
      - uses: actions/checkout@v4

      - name: setup docker buildx
        uses: docker/setup-buildx-action@v3

      - name: login to github container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: build and push insignia postgresql image
        uses: docker/build-push-action@v5
        with:
          push: true
          context: ./docker
          file: ./postgres.Dockerfile
          tags: ghcr.io/${{ github.repository }}:postgresql-${{ inputs.image_version_tag }}

  build-insignia-image:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64]

    steps:
      - uses: actions/checkout@v4

      - name: setup docker buildx
        uses: docker/setup-buildx-action@v3

      - name: login to github container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: build and push insignia image
        uses: docker/build-push-action@v5
        with:
          push: true
          context: ./insignia_backend
          file: ../docker/insigia.Dockerfile
          tags: ghcr.io/${{ github.repository }}:${{ inputs.image_version_tag }}
